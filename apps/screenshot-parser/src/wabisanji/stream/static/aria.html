<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARIA answer card</title>
<!-- OBS browser source: 600x340, transparent. Served by `wabisanji serve` on :8770.
     The card sits at the bottom of the source and grows upwards. -->
<style>
  :root {
    --card: rgba(43, 47, 85, 0.88);   /* indigo #2b2f55, as in the vocab overlay */
    --amber: #e8a04a;
    --cream: #f2ecdc;
    --muted: rgba(242, 236, 220, 0.7);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body {
    width: 600px;
    height: 340px;
    overflow: hidden;
    background: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 12px;
    font-family: "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", "Segoe UI", sans-serif;
    color: var(--cream);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
  }

  #card {
    padding: 12px 16px 14px;
    border-radius: 12px;
    background: var(--card);
    border-left: 4px solid var(--amber);
    transition: opacity 350ms ease, transform 350ms cubic-bezier(.2, .8, .2, 1);
  }
  #card.gone { opacity: 0; transform: translateY(24px); }

  .who {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--amber);
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--amber);
  }
  .listening .dot, .thinking .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; transform: scale(0.7); } }

  .heard {
    margin-top: 6px;
    font-size: 16px;
    font-style: italic;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .heard:empty { display: none; }

  .hint {
    margin-top: 6px;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.25;
  }
  .hint:empty { display: none; }
  .expanded .hint { font-size: 18px; }

  ol {
    margin-top: 8px;
    padding-left: 22px;
    font-size: 17px;
    line-height: 1.35;
  }
  ol:empty { display: none; }
  li + li { margin-top: 3px; }
  li::marker { color: var(--amber); font-weight: 700; }

  .foot {
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .foot:empty { display: none; }
</style>
</head>
<body>
<div id="card" class="gone">
  <div class="who"><span class="dot"></span><span class="label">ARIA</span></div>
  <div class="heard"></div>
  <div class="hint"></div>
  <ol class="steps"></ol>
  <div class="foot"><span class="source"></span><span class="more"></span></div>
</div>

<script>
  const POLL_MS = 300;
  // How long each state stays up after its last update
  const TTL_MS = { listening: 12000, thinking: 90000, hint: 45000, expanded: 90000 };
  const LABEL = { listening: "ARIA · listening", thinking: "ARIA · looking it up",
                  hint: "ARIA", expanded: "ARIA" };

  const el = document.getElementById("card");
  const $ = sel => el.querySelector(sel);
  let version = -1;
  let card = null;
  let shownAt = 0;   // local clock, so a PC/server clock skew can't hide cards early

  function render() {
    if (!card) { el.classList.add("gone"); return; }
    el.className = card.status;
    $(".label").textContent = LABEL[card.status];
    $(".heard").textContent = card.heard ? `“${card.heard}”` : "";
    const answered = card.status === "hint" || card.status === "expanded";
    $(".hint").textContent = answered ? card.hint : "";
    const steps = card.status === "expanded" ? card.steps || [] : [];
    $(".steps").replaceChildren(...steps.map(s => {
      const li = document.createElement("li");
      li.textContent = s;
      return li;
    }));
    $(".source").textContent = answered && card.source_name ? `via ${card.source_name}` : "";
    $(".more").textContent =
      card.status === "hint" && (card.steps || []).length ? "say “ARIA, more” for steps" : "";
    $(".foot").style.display = $(".source").textContent || $(".more").textContent ? "" : "none";
  }

  function expire() {
    if (card && Date.now() - shownAt > TTL_MS[card.status]) {
      card = null;
      render();
    }
  }

  async function poll() {
    try {
      const r = await fetch("/api/live/card", { cache: "no-store" });
      if (r.ok) {
        const data = await r.json();
        if (data.version !== version) {
          // First load after a reload: only show cards that are still fresh
          const fresh = version !== -1 || (data.card && Date.now() / 1000 - data.card.updated < 30);
          version = data.version;
          card = fresh ? data.card : null;
          shownAt = Date.now();
          render();
        }
      }
    } catch (e) {
      console.warn(e);
    }
    expire();
    setTimeout(poll, POLL_MS);
  }

  poll();
</script>
</body>
</html>
