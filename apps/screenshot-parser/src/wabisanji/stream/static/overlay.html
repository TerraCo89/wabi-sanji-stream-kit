<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Wabi Sanji vocab overlay</title>
<!-- OBS browser source: 340x1080, transparent. Served by `wabisanji serve` on :8770. -->
<style>
  :root {
    --card: rgba(43, 47, 85, 0.8);   /* indigo #2b2f55 at 80% */
    --amber: #e8a04a;
    --cream: #f2ecdc;
    --gap: 10px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body {
    width: 340px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    gap: var(--gap);
    font-family: "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--cream);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    transition: opacity 400ms ease;
  }
  body.hidden { opacity: 0; }

  #cards {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    overflow: hidden;   /* long meanings push the oldest card out, not over the footer */
  }

  .card {
    position: relative;
    flex-shrink: 0;
    padding: 10px 14px 12px;
    border-radius: 10px;
    background: var(--card);
    border-left: 3px solid transparent;
  }
  .card.is-new { border-left-color: var(--amber); }

  .card.enter { animation: slide-in 420ms cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes slide-in {
    from { opacity: 0; transform: translateX(-36px); }
    to   { opacity: 1; transform: none; }
  }

  .word {
    font-size: 34px;
    font-weight: 700;
    line-height: 1.15;
    overflow-wrap: anywhere;
    padding-right: 44px;   /* room for the NEW pip */
  }
  .reading {
    font-size: 15px;
    color: var(--amber);
    margin-top: 2px;
  }
  .reading:empty { display: none; }
  .meaning {
    font-size: 16px;
    line-height: 1.3;
    margin-top: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .pip {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--amber);
    color: #2b2f55;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-shadow: none;
  }
  .card:not(.is-new) .pip { display: none; }

  #today {
    flex-shrink: 0;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--card);
    font-size: 18px;
    font-weight: 700;
  }
  #today .n { color: var(--amber); }
</style>
</head>
<body>
<div id="cards"></div>
<div id="today">今日: <span class="n">0</span> words</div>

<script>
  const MAX_CARDS = 8;
  const POLL_MS = 2000;
  const cardsEl = document.getElementById("cards");
  const todayEl = document.querySelector("#today .n");
  const cards = new Map();   // vocabulary id -> element
  let firstRender = true;

  function makeCard() {
    const el = document.createElement("div");
    el.className = "card";
    for (const cls of ["word", "reading", "meaning", "pip"]) {
      const part = document.createElement("div");
      part.className = cls;
      el.appendChild(part);
    }
    el.querySelector(".pip").textContent = "NEW";
    el.addEventListener("animationend", () => el.classList.remove("enter"));
    return el;
  }

  function fill(el, w) {
    const word = el.querySelector(".word");
    word.textContent = w.word;
    // Shrink long words so they stay on one or two lines
    word.style.fontSize = w.word.length <= 5 ? "" : w.word.length <= 8 ? "28px" : "22px";
    el.querySelector(".reading").textContent = w.reading && w.reading !== w.word ? w.reading : "";
    el.querySelector(".meaning").textContent = w.meaning || "";
    el.classList.toggle("is-new", w.is_new);
  }

  function render(words) {
    words = words.slice(0, MAX_CARDS);
    const keep = new Set(words.map(w => w.id));

    // FLIP: remember where surviving cards were so reflow animates
    const before = new Map();
    for (const [id, el] of cards) {
      if (keep.has(id)) before.set(id, el.getBoundingClientRect().top);
      else { el.remove(); cards.delete(id); }
    }

    words.forEach((w, i) => {
      let el = cards.get(w.id);
      if (!el) {
        el = makeCard();
        el.classList.add("enter");
        if (firstRender) el.style.animationDelay = `${i * 60}ms`;
        cards.set(w.id, el);
      }
      fill(el, w);
      cardsEl.appendChild(el);   // appending in order also reorders existing cards
    });

    for (const [id, top] of before) {
      const el = cards.get(id);
      const dy = top - el.getBoundingClientRect().top;
      if (!dy) continue;
      el.animate(
        [{ transform: `translateY(${dy}px)` }, { transform: "none" }],
        { duration: 420, easing: "cubic-bezier(.2, .8, .2, 1)" },
      );
    }
    firstRender = false;
  }

  async function getJSON(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(`${url}: ${r.status}`);
    return r.json();
  }

  async function poll() {
    try {
      const [words, state, today] = await Promise.all([
        getJSON(`/api/words?limit=${MAX_CARDS}`),
        getJSON("/api/state"),
        getJSON("/api/today"),
      ]);
      document.body.classList.toggle("hidden", state.overlay_hidden);
      render(words.words);
      todayEl.textContent = today.new_words;
    } catch (e) {
      // Server restarting or DB busy: keep the last cards on screen
      console.warn(e);
    }
    setTimeout(poll, POLL_MS);
  }

  poll();
</script>
</body>
</html>
