# ARIA's meme library. Files live in the memes folder
# (stream.live.memes_dir in apps/screenshot-parser/config.yaml, or WABISANJI_MEMES).
# Live, ARIA pops them on stream; after the stream, /stream-memes adds a few to
# episodes on moments that missed one.
#
# Each meme:
#   id:         short and unique; `wabisanji live meme <id>` pops it by hand
#   file:       clip with sound (.mp4), sound (.mp3) or image/GIF. Clips and
#               sounds play to the end (12 s cap)
#   caption:    for sounds: the line, shown on screen while it plays
#   phrases:    things the streamer says that fire it instantly (1-2 s after the sentence).
#               Use distinctive lines ("it's a trap"), not everyday words ("trap").
#               3+ word phrases also match when Whisper gets a word slightly wrong.
#   about:      what it means and when it fits. Claude reads this to pick memes
#               live and for episodes, so be specific about the situation.
#   category:   fail | shock | suspicion | win | awkward | chaos | time | greeting |
#               numbers | innuendo | japanese
#   risk:       Content ID risk of the audio: low (library sound effects), med (TV,
#               viral and game clips), high (film studios, clips of music).
#               Episodes use any risk; Shorts only low. Music-based memes
#               (Roundabout, coffin dance, Rickroll...) stay out of the library.
#   family:     false for innuendo and the like: skipped in family mode ("Hey ARIA,
#               family mode") and never put in episodes where kids are on stream
#   cooldown_s: optional, default 300: the same meme won't repeat sooner
#
# Add one: wabisanji live fetch "ytsearch:<what to search>" --expect "<the line>"
#   --id <id> --caption ... --category ... --risk ... --about "..." (see --help)
# Check it with: apps/screenshot-parser/.venv/Scripts/wabisanji.exe live memes

memes:
  - id: thats-what-she-said
    file: thats-what-she-said.mp4  # The Office (official Peacock clip on GIPHY), 6.8 s
    phrases: ["that's what she said", "thats what she said"]
    about: Jim says "That's what she said", then Michael Scott, "Hey! Nice! Really good!".
      Fire when the streamer says an accidental innuendo, like "it's so hard", "it won't fit",
      "that's huge", "I can't get it in", "it's too big", "go deeper", "just put it in".
      Real Civil Engineer's most-used cutaway.
    category: innuendo
    risk: med
    family: false

