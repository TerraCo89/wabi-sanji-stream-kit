  game: { crop: [380, 0, 940, 840], width: 1080, y: 200 }
  cam: { crop: [1500, 720, 400, 260], width: 860, y: 1180, auto: true }
  thumb: { hide: [[1300, 0, 620, 400]] }   # chat runs from the top (Satisfactory 2026-10-16)
  captions: { bottom: 1150 }

gaming_cam_left:
