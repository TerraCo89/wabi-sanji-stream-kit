  game: { crop: [570, 0, 750, 840], width: 1000, y: 160 }
  cam: { crop: [170, 700, 400, 260], width: 860, y: 1300, auto: true, region: [0.0, 0.4, 0.45, 1.0] }
  thumb: { hide: [[1300, 140, 620, 240]] }
  captions: { bottom: 1260 }

# gaming_cam_left with the chat bottom right instead of top right (Enshrouded 2026-10-17_2: cam x 0-640,
# y >= ~500; chat x >= ~1320, y >= ~860). Same Short boxes; the thumbnail blurs the in-frame cam (the streamer
# is cut out on top anyway) and the chat.
gaming_cam_left_chat_low:
  game: { crop: [570, 0, 750, 840], width: 1000, y: 160 }
  cam: { crop: [170, 700, 400, 260], width: 860, y: 1300, auto: true, region: [0.0, 0.4, 0.45, 1.0] }
  thumb: { hide: [[0, 480, 680, 600], [1300, 860, 620, 220]] }
  captions: { bottom: 1260 }

# gaming_cam_left with a narrower cam (Enshrouded 2026-10-20: cam x 0-~430, y >= ~670; the streamer's face x ~200-300,
# y ~750-920; chat top right). The auto crop ran past the cam's right edge and showed a strip of game beside the streamer.
gaming_cam_left_narrow:
  game: { crop: [570, 0, 750, 840], width: 1000, y: 160 }
  cam: { crop: [10, 680, 420, 300], width: 800, y: 1290 }
  thumb: { hide: [[0, 640, 460, 440], [1300, 100, 620, 280]] }   # the in-frame cam (the streamer is cut out on top) and the chat
  captions: { bottom: 1260 }

# gaming_cam_left for a prop held up to the cam (2026-10-17_2 s05, the DeLorean model at 0:49:12-0:49:32:
# held at chest height, then low in the bottom-left corner, x 40-640, y 800-1080). Fixed wide cam crop
# instead of auto face, so the prop stays in; a short game strip on top.
gaming_cam_left_prop:
  game: { crop: [480, 200, 960, 400], width: 1080, y: 180 }
  cam: { crop: [0, 440, 720, 640], width: 1000, y: 640 }
  thumb: { hide: [[1300, 140, 620, 240]] }
  captions: { bottom: 620 }

# The Galactic Racer tour map, for clips about the planet name and its Aurebesh line at the
