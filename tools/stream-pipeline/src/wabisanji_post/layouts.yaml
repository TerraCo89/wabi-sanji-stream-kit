# Shorts layouts: where the game and facecam sit in the 1920x1080 OBS scenes, and where
# they go in the 1080x1920 Short. Measured 2026-10-05 from full-res frames of
# "2026-10-05 10-37-11.mkv" (Japanese scene at 00:41:30 / 00:44:30, Alchemy Factory at
# 01:05:18 / 02:08:20). crop = [x, y, w, h] in 1920x1080 REFERENCE pixels, whatever the recording's
# size: OBS records 2560x1440 from 2026-10-18_2, and render scales each crop to the real frame
# (media.to_source), so a 2K Short is cropped at full resolution. Measure new boxes from a 2K frame
# at 0.75x (or from a 960 px `stream-frames --at` still at 2x).
#
# Output: blurred, darkened game fills the frame; game stacked on top, facecam below.
# Shorts UI covers roughly the top 120 px and the bottom 380 px; faces stay above y 1540.
# The twitch.tv/WabiSanji badge (badge.py, 496x152) goes top centre at y 24 unless a layout
# sets `badge: { y, x }` or `badge: false`. Its corners stay clear of the Shorts back/search icons.
# `thumb: { crop }` is the background of the 1280x720 episode thumbnail (stream/thumbnail.py);
# without it the whole frame is used (full-screen games). `hide` boxes (chat overlays: viewer names,
# swearing) are blurred out of the thumbnail first.

japanese:
  # Game capture is 1600x900 at (228, 89); the dialogue box frame hangs to y 1007.
  # x 336 clears the 340 px vocab column; x 1546 stops before most of the chat overlay
  # (x >= 1455, only while chat is active) and the facecam (x >= 1410, y >= 780).
  game: { crop: [336, 89, 1210, 920], width: 1080, y: 300 }
  # Background-removed facecam over the game, bottom right. Kept inside the game capture
  # (x <= 1828, y <= 990): outside it the canvas is black and showed as an L behind the streamer.
  cam: { crop: [1400, 740, 428, 250], width: 860, y: 1140 }
  thumb: { crop: [340, 89, 1488, 837], hide: [[1440, 89, 480, 991]] }   # the game capture right of the vocab column; chat at x >= 1455
  cards: { y: 40 }              # vocab word cards, top band (230 px tall)
  badge: false                  # the word card holds the top band for most of the clip
  # Captions sit just under the card, over the top of the game: the dialogue box is at
  # the bottom of the game and the cam below must stay clear.
  captions: { bottom: 430 }

# Japanese scene with a 4:3 game capture (2026-10-12): game 1102x826 at (395, 87), Anki window
# top right (x >= 1550, y <= 410), pet cam below it, background-removed streamer bottom right
# (x 1410-1810, y >= 720) over the background art, chat line at y ~1060. The BoF4 dialogue box
# moves between the top and the bottom of the game, so captions go between the game and the cam.
japanese_43:
  game: { crop: [395, 87, 1102, 826], width: 1080, y: 290 }
  cam: { crop: [1400, 720, 440, 340], width: 640, y: 1240, auto: true, region: [0.65, 0.6, 1.0, 1.0] }
  thumb: { crop: [395, 87, 1102, 826] }
  cards: { y: 40 }
  badge: false
  captions: { bottom: 1225 }

# japanese_43 with the cam crop starting right of the game capture (2026-10-19: game x 394-1500, y 88-916; the
# BoF4 dialogue portrait reaches x ~1440, y 680-860, so the x 1400 cam crop showed a slice of it beside the streamer).
# The streamer x ~1460-1800, face y ~744-940. Fixed crop (no auto), moved up so the chin stays above the Shorts UI.
japanese_43_cam_right:
  game: { crop: [395, 87, 1102, 826], width: 1080, y: 290 }
  cam: { crop: [1500, 730, 400, 330], width: 640, y: 1200 }
  thumb: { crop: [395, 87, 1102, 826] }
  cards: { y: 40 }
  badge: false
  captions: { bottom: 1190 }

gaming:
  # Alchemy Factory full screen. Skip the HUD's right edge, the chat (bottom left,
  # x up to ~560, grows upward as messages arrive) and most of the facecam (x >= 1330, y >= 740).
  game: { crop: [570, 0, 940, 840], width: 1080, y: 200 }
  # Wide enough for the streamer leaning right; only a sliver of the HUD buttons (x >= 1680, y >= 900).
  cam: { crop: [1310, 730, 400, 260], width: 860, y: 1180, auto: true }   # auto: follow the detected face (backlog scenes vary); crop = fallback
  thumb: { hide: [[0, 420, 640, 660]] }   # chat, bottom left (Galactic Racer 2026-10-14 had it there too)
  # Captions along the bottom of the game (factory floor), clear of the streamer's face.
  captions: { bottom: 1150 }

# `gaming` with a fixed cam crop (Final Fantasy Resonance 2026-10-23 c02, the green Lazarov lab at 5:08: the auto
# face crop locked onto the game and missed the streamer). The streamer is background-removed bottom right, x ~1340-1840, head y ~680.
gaming_cam_right_fixed:
  game: { crop: [570, 0, 940, 840], width: 1080, y: 200 }
  cam: { crop: [1340, 640, 540, 350], width: 860, y: 1180 }
  thumb: { hide: [[0, 420, 640, 660], [1300, 560, 620, 520]] }   # chat, and the in-frame cam (the streamer is cut out on top)
  captions: { bottom: 1150 }

# `gaming_cam_right_fixed` with the game crop 70 px further left (Final Fantasy Resonance 2026-10-25 c05: Borin's
# lever note is centred-left, text x 536-1380, so the x 570 crop cut the start of every line).
gaming_cam_right_fixed_left:
  game: { crop: [500, 0, 940, 840], width: 1080, y: 200 }
  cam: { crop: [1340, 640, 540, 350], width: 860, y: 1180 }
  thumb: { hide: [[0, 420, 640, 660], [1300, 560, 620, 520]] }
  captions: { bottom: 1150 }

# Gameplay EN with chat top right (Galactic Racer, 2026-10-07 / 2026-10-08). Measured from
# full-res frames: chat x >= 1320, y 180-330. Cam bottom right (x >= 1500, y >= 690) or, on
