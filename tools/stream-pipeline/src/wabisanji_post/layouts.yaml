# response: watching another creator's video full screen in Brave with the big background-removed
# cam bottom right (2026-10-14_2, ConnorClips watch-along). Measured from the full-res frame at
# 00:43:00: YouTube player x ~197-1740, y ~90-960; Connor x ~620-1270 (their chat panel x <= ~600);
# The streamer x >= 1150 from y ~450 (head x ~1440-1660, y ~460-730). First preview (r01): x 600 showed the edge
# of Connor's chat panel and x 1300 caught the streamer's raised hand, so the game crop is x 700-1270; the cam is
# cropped tighter and drawn bigger. Second preview: The streamer's face reached y ~1580 (under the Shorts UI), so
# the game crop is shorter and the cam moves up to y 1060 (face ~1300-1480).
response:
  game: { crop: [700, 120, 570, 460], width: 1080, y: 180 }
  cam: { crop: [1330, 470, 590, 540], width: 820, y: 1060, auto: true, region: [0.6, 0.4, 1.0, 1.0] }
  # Thumbnail: the YouTube player with the creator's chat panel blurred (viewer names); the streamer is cut out
  # of face_box only, so nothing from the video joins the cutout.
  thumb: { crop: [197, 90, 1543, 868], hide: [[197, 90, 430, 870]], face_box: [1250, 420, 670, 660] }
  captions: { bottom: 1040 }
# response_x: the same watch-along while Connor's video shows Jake Lucky's X post of the Nadeshot clip
# (2026-10-14_2, 00:07 to 00:17). From the full-res frame at 00:12:55: tweet text x ~650-1300, y ~180-340;
# the embedded video x ~653-1357, y ~353-747 (Nadeshot's face y ~400-630); the streamer's cutout from x ~1240.
response_x:
  game: { crop: [640, 180, 600, 460], width: 1080, y: 180 }
  cam: { crop: [1330, 470, 590, 540], width: 820, y: 1060, auto: true, region: [0.6, 0.4, 1.0, 1.0] }
  thumb: { crop: [197, 90, 1543, 868], hide: [[197, 90, 430, 870]], face_box: [1250, 420, 670, 660] }
  captions: { bottom: 1000 }
